<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <button id="invoke">调用 Leap</button>
    <output id="result"></output>
    <script>
      document.querySelector("#invoke").addEventListener("click", async () => {
        const result = await window.leap.invoke("web.echo", "来自网页");
        document.querySelector("#result").textContent = result;
      });
    </script>
  </body>
</html>
